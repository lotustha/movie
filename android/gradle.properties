org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Project on D:\ + pub cache on C:\ breaks the Kotlin incremental compiler on Windows.
kotlin.incremental=false
# unity_ads_plugin compiles Java at 1.8 while Kotlin targets the JDK default,
# which Gradle rejects as an inconsistent JVM-target. Downgrade that check to a
# warning — Android's D8 dexer consumes both class-file versions fine.
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
